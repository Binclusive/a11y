name: "Binclusive accessibility (CI gate)"
description: "Run the Binclusive accessibility engine on changed files, gate the PR, emit SARIF, and (with a token) phone findings home to the dashboard."
author: "Binclusive"
inputs:
  base:
    description: "Git ref to diff against (e.g. the PR base). Empty scans the whole checkout."
    required: false
    default: ""
  fail-on:
    description: "block|warn — the enforcement level that fails the build. Default block."
    required: false
    default: "block"
  # PR comment surface (OPTIONAL, local-first, default OFF). Independent of phone-home: the sticky
  # summary is stateless — no key, no project id, no ingest — so on a local-first run it is the ONLY
  # PR comment surface that exists. The inline review-comment lane is verdict-driven (no
  # `binclusive-api-key` → no ingest → no verdicts → that lane skips), so this is not a second copy
  # of the findings: it is one index comment beside N per-line comments.
  # Default OFF is deliberate. `emitPrSummary` fails LOUD under present intent (throws
  # `PrCommentError`, monorepo#2908), so switching it on against a mis-scoped `pull-requests:`
  # permission is a RED BUILD, not a missing comment. That has to be the workflow author's choice,
  # never a silent default. `"false"` (not `""`) because the entrypoint matches the VALUE.
  summary:
    description: >
      OPTIONAL. `true` posts ONE sticky rollup comment on the pull request — finding counts by
      level plus the top offending files — rewritten in place each run rather than appended.
      Opt-in, default `false`. Requires `permissions: pull-requests: write` on the job: with the
      permission missing the run FAILS the build rather than quietly skipping the comment, so turn
      both on together. Needs no `binclusive-api-key` — this lane is fully local.
    required: false
    default: "false"
  # Phone-home surface (all OPTIONAL, local-first): the `ci` command uploads findings to the
  # dashboard ONLY when `binclusive-api-key` is set. Absent key → the scan stays fully local (stdout +
  # SARIF), exit 0 — never an error. The CLI reads these off `BINCLUSIVE_*` env directly; the Docker
  # runner passes this action's `env:` block into the container, so they reach the CLI unchanged.
  # `binclusive-org-id` is DELIBERATELY absent: org is derived server-side from the key's own membership
  # (ADR 0038); re-adding it re-opens the #2100/#2160 confused-deputy surface.
  binclusive-api-key:
    description: >
      OPTIONAL. A Binclusive `b8e_` apiKey (the ingestion bearer). Present → the run phones its
      findings home to the dashboard; absent → fully local, exit 0 (never an error). Mint it in the
      dashboard and store it as a repo secret. NOT an LLM key.
    required: false
    default: ""
  binclusive-project-id:
    description: >
      OPTIONAL. The Binclusive project id the findings belong to. Required alongside `binclusive-api-key`
      for phone-home — it selects WHICH project and cannot be derived from the key (one key spans
      many projects). Absent (with a key set) is a loud error from the CLI.
    required: false
    default: ""
  binclusive-api-url:
    description: >
      OPTIONAL. Override the Kontrol GraphQL endpoint the findings are sent to (default
      https://kontrol.binclusive.io/graphql). For staging / self-host only. The ONE endpoint var.
    required: false
    default: ""
  # WHICH deployment this run scanned (monorepo#3679). Read only on the phone-home path, so it is
  # inert on a local-first run. DELIBERATELY has NO `default:` — the rule the CLI deleted was
  # "no PR ref ⇒ production", and `production` is the dashboard's DEFAULT filter, so a guess here
  # silently lands a staging scan in the customer's most-trusted view. A default would reproduce
  # that guess one layer out; the safe state must be visibly broken, not quietly production.
  # Unprefixed like `base`/`fail-on` (a fact about the SCAN), not `binclusive-*` (a credential).
  environment:
    description: >
      Which deployment this run scanned — `pr`, `staging` or `production`. NOT needed on an
      `on: pull_request` workflow: the run's own PR ref stamps `pr`. REQUIRED on any non-PR
      trigger (push / schedule / workflow_dispatch) that also sets `binclusive-api-key` — such a
      run cannot be told apart from a staging pipeline or a developer's manual run, so the CLI
      refuses to send rather than guess. No default by design.
    required: false
  # Branded bot identity (all OPTIONAL, local-first): with the id + private key set, the `ci`
  # command mints a short-lived binclusive[bot] installation token so phone-home writes are
  # attributed to the branded App instead of the default workflow bot. Any one blank → the run
  # silently falls back to the workflow token, never an error. The CLI reads these off
  # `BINCLUSIVE_APP_*` env directly (same pattern as `B8E_*`); the Docker runner passes this
  # action's `env:` block into the container, so they reach the CLI unchanged.
  binclusive-app-id:
    description: >
      OPTIONAL. The Binclusive GitHub App id. Present alongside the private key → phone-home writes
      are attributed to the branded binclusive[bot]; absent → the default workflow bot. Store as a
      repo secret.
    required: false
    default: ""
  binclusive-app-private-key:
    description: >
      OPTIONAL. The Binclusive GitHub App private key (PEM). SECRET MATERIAL — store as a repo
      secret; never log or echo it. Required alongside `binclusive-app-id` to mint the branded
      token; absent → the default workflow bot.
    required: false
    default: ""
  binclusive-app-installation-id:
    description: >
      OPTIONAL. The App installation id for this repo. Usually unnecessary — when absent it is
      discovered from the repo, so you only install the App, never look up its id.
    required: false
    default: ""
outputs:
  sarif-file:
    description: "Path to the SARIF file; feed to github/codeql-action/upload-sarif (needs security-events: write)."
runs:
  using: "docker"
  # Moving major tag — tracks the latest v0 image; no exact pin (release-please deferred, monorepo#2553).
  image: "docker://ghcr.io/binclusive/binclusive:0"
  env:
    # Scope + gate: the image entrypoint marshals these INPUT_* vars into `binclusive ci` flags
    # (INPUT_BASE → --base, INPUT_FAIL_ON → --fail-on, INPUT_SUMMARY → --summary). The mapping is
    # EXPLICIT — nothing here rides GitHub's implicit INPUT_* convention, so an input declared
    # above and missing from this block is a dark feature (monorepo#4430).
    INPUT_BASE: ${{ inputs.base }}
    INPUT_FAIL_ON: ${{ inputs.fail-on }}
    # Sticky PR summary: `--summary` carries no value, so the entrypoint matches this var's VALUE
    # (`true` on; `false` and `""` off; anything else exits 2) instead of testing presence — the
    # `-n` guard the two value-carrying vars use would read the string "false" as ON. Same
    # empty-forward as BINCLUSIVE_ENVIRONMENT below: an `env:` key cannot be conditionally omitted,
    # so an unset `summary:` input arrives as "" and is read as off. Hence the `"false"` default on
    # the input — a genuine boolean-string, never `""` and never `true`.
    INPUT_SUMMARY: ${{ inputs.summary }}
    # Phone-home: the `ci` command reads these off process.env directly (no entrypoint marshalling).
    # CLI 0.6.0 reads BINCLUSIVE_* only; `binclusive-api-url` maps to BINCLUSIVE_API_URL — the CLI's
    # single endpoint var (supersedes the old per-ingest ingest URL).
    BINCLUSIVE_API_KEY: ${{ inputs.binclusive-api-key }}
    BINCLUSIVE_PROJECT_ID: ${{ inputs.binclusive-project-id }}
    BINCLUSIVE_API_URL: ${{ inputs.binclusive-api-url }}
    # Deployment stamp: an `env:` key cannot be conditionally omitted, so an unset `environment`
    # input reaches the container as BINCLUSIVE_ENVIRONMENT="". That is EXACTLY equivalent to
    # unset here — `resolveCiEnvironment` trims and treats blank as absent, so a PR run still
    # stamps `pr` and a non-PR run still refuses loudly. (This is the one place the empty-forward
    # is safe by construction; `BINCLUSIVE_API_URL` needed a CLI-side fix for the same shape,
    # monorepo#3135 — do not assume it, the CLI's blank-is-absent test is the guarantee.)
    BINCLUSIVE_ENVIRONMENT: ${{ inputs.environment }}
    # Branded bot identity: read off process.env directly (like B8E_*) to mint a short-lived
    # binclusive[bot] token (monorepo#2854); any blank → default workflow bot. Private key is
    # secret material — never logged.
    BINCLUSIVE_APP_ID: ${{ inputs.binclusive-app-id }}
    BINCLUSIVE_APP_PRIVATE_KEY: ${{ inputs.binclusive-app-private-key }}
    BINCLUSIVE_APP_INSTALLATION_ID: ${{ inputs.binclusive-app-installation-id }}
