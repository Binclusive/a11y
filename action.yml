name: "Binclusive accessibility (CI gate)"
description: "Run the Binclusive accessibility engine on changed files, gate the PR, emit SARIF, and phone findings home to the dashboard. Requires a Binclusive API key."
author: "Binclusive"
inputs:
  base:
    description: "Git ref to diff against (e.g. the PR base). Empty scans the whole checkout."
    required: false
    default: ""
  fail-on:
    description: "block|warn — the enforcement level that fails the build. Default block."
    required: false
    default: "block"
  # Job summary surface (OPTIONAL input, default OFF). Rendered from the run's own findings with
  # no dashboard round-trip — but it rides an authenticated `ci` run like everything else. Needs no
  # GitHub token and no pull request, so it also renders on `push`, `schedule` and
  # `workflow_dispatch` runs.
  summary:
    description: >
      OPTIONAL. `true` emits the rollup digest — finding counts by level plus the top offending
      files — to `$GITHUB_STEP_SUMMARY`, the run's own summary page. Opt-in, default `false`.
      Needs no GitHub token and no permission grant. Like every `ci` run it still requires
      `binclusive-api-key`.
    required: false
    default: "false"
  # Identity + ingest surface. `binclusive-api-key` and `binclusive-project-id` are REQUIRED: since
  # CLI 0.21.0 `ci` authenticates BEFORE it scans (monorepo#4845), so an absent key is exit 7
  # with no SARIF written — not a local run. The CLI reads these off `BINCLUSIVE_*` env directly; the
  # Docker runner passes this action's `env:` block into the container, so they reach the CLI unchanged.
  # `binclusive-org-id` is DELIBERATELY absent: org is derived server-side from the key's own membership
  # (ADR 0038); re-adding it re-opens the #2100/#2160 confused-deputy surface.
  binclusive-api-key:
    description: >
      REQUIRED. A Binclusive `b8e_` apiKey — the run's identity, not merely the ingestion bearer.
      Absent → `ci` exits 7 (`Not authenticated`) before scanning and writes no SARIF. Mint it in
      the dashboard and store it as a repo secret. NOT an LLM key.
    required: true
  binclusive-project-id:
    description: >
      REQUIRED. The Binclusive project id the findings belong to — it selects WHICH project and
      cannot be derived from the key (one key spans many projects). Absent is a loud error from
      the CLI.
    required: true
  binclusive-api-url:
    description: >
      OPTIONAL. Override the Kontrol GraphQL endpoint the findings are sent to (default
      https://kontrol.binclusive.io/graphql). For staging / self-host only. The ONE endpoint var.
    required: false
    default: ""
  # WHICH deployment this run scanned (monorepo#3679). Every run is authenticated and phones home,
  # so this is ALWAYS live — there is no local-first run for it to be inert on. DELIBERATELY has NO
  # `default:` — the rule the CLI deleted was
  # "no PR ref ⇒ production", and `production` is the dashboard's DEFAULT filter, so a guess here
  # silently lands a staging scan in the customer's most-trusted view. A default would reproduce
  # that guess one layer out; the safe state must be visibly broken, not quietly production.
  # Unprefixed like `base`/`fail-on` (a fact about the SCAN), not `binclusive-*` (a credential).
  environment:
    description: >
      Which deployment this run scanned — `pr`, `staging` or `production`. NOT needed on an
      `on: pull_request` workflow: the run's own PR ref stamps `pr`. REQUIRED on any non-PR
      trigger (push / schedule / workflow_dispatch) — such a run cannot be told apart from a
      staging pipeline or a developer's manual run, so the CLI refuses to send rather than guess.
      No default by design.
    required: false
outputs:
  sarif-file:
    description: "Path to the SARIF file; feed to github/codeql-action/upload-sarif (needs security-events: write)."
runs:
  using: "docker"
  # DIGEST-PINNED, deliberately.
  #
  # This used to be the moving `:0` tag, which the monorepo's `release-image.yml` re-points on every
  # prod push. That made an image change reach every customer's next run with nobody merging
  # anything and nobody being told — and the way it lands is worse than a normal break: the
  # container writes SARIF on stdout, so a run that refuses writes an EMPTY file and the customer's
  # `upload-sarif` step reports "Invalid SARIF. Unexpected end of JSON input", naming the wrong
  # cause (monorepo#4131, #4509).
  #
  # A digest cannot be re-pointed. A customer runs exactly these bytes until a repin PR lands here
  # and `release.yml` moves `@v0` — a diff someone read and can revert with a revert button.
  #
  # WHO BUMPS IT: the monorepo's `release-image.yml` opens that repin PR against this repo after it
  # has published, anonymously pulled and run-smoked the new image. No token there, or a hiccup,
  # leaves customers on the digest below — the safe state — and prints the one-line manual bump.
  # The `:0` tag still exists in GHCR and still tracks the newest build; nothing here follows it, so
  # `git log` on this line is the complete history of what customers have executed.
  #
  # `action-validate.yml` proves this digest resolves anonymously and is the `binclusive ci` image.
  image: "docker://ghcr.io/binclusive/binclusive@sha256:0e4d1414823081f42a714286d27c4a8bffa04e7cabf1631b19a43d42ea36ac81"
  env:
    # Scope + gate: the image entrypoint marshals these INPUT_* vars into `binclusive ci` flags
    # (INPUT_BASE → --base, INPUT_FAIL_ON → --fail-on, INPUT_SUMMARY → --summary).
    #
    # How INPUT_* is actually set for a Docker action: the runner injects `INPUT_<NAME>` for
    # EVERY DECLARED input before this block is merged — uppercased, spaces → `_`, and HYPHENS
    # PRESERVED. So `fail-on` arrives as `INPUT_FAIL-ON`, not `INPUT_FAIL_ON`. This block is then
    # merged only where a key is not already set, so it never overwrites an injected var.
    # Which lines below are therefore load-bearing:
    #   INPUT_FAIL_ON  — YES. The implicit name is `INPUT_FAIL-ON`; the entrypoint reads the
    #                    underscored one, so without this line the gate level never arrives.
    #   INPUT_BASE     — no, redundant with the injected var. Kept for rename-safety.
    #   INPUT_SUMMARY  — no, same. Kept so renaming the input id is caught here rather than
    #                    silently changing which var the container reads.
    # The container receives no GITHUB credential at all: the runner does not forward one
    # automatically, and no input declares one. It DOES receive your Binclusive key, which is
    # required — store BINCLUSIVE_API_KEY and BINCLUSIVE_PROJECT_ID as repo secrets before this
    # action can run.
    # None of that softens the defect this file fixes. `summary` was dark because the INPUT WAS
    # NOT DECLARED AT ALL (monorepo#4430): no input, no implicit var, and `with: summary:` on an
    # undeclared input is warned-and-dropped by the runner. The missing DECLARATION was the bug.
    INPUT_BASE: ${{ inputs.base }}
    INPUT_FAIL_ON: ${{ inputs.fail-on }}
    # Sticky PR summary: `--summary` carries no value, so the entrypoint matches this var's VALUE
    # (`true` on; `false` and `""` off; anything else REFUSES with exit 4) instead of testing
    # presence — the `-n` guard the two value-carrying vars use would read the string "false" as ON.
    # Exit 4 is `CLI_EXIT.config`, NOT 2: a typo'd input is a malformed INVOCATION, and 4 is
    # already the code an unrecognised `--format` / `--fail-on` gets. 2 is `crash` — the tool
    # failed to run — which is a different claim and would send the reader hunting a fault that
    # is not there. (`auth` shared 2 until CLI 0.19.0 moved it to 7, so the old collision is
    # gone; the reason for choosing 4 never depended on it.)
    # An `env:` key cannot be conditionally omitted, so this var is ALWAYS set — but with
    # `default: "false"` on the input, an omitted `summary:` arrives as the string `false`, never
    # `""`. `""` reaches the container only on an explicit `summary: ""` or an expression that
    # resolves blank; the entrypoint reads both as off, so neither is a trap. (This is NOT the
    # BINCLUSIVE_ENVIRONMENT shape below — that input has no `default:` at all, which is exactly
    # why it empty-forwards.)
    INPUT_SUMMARY: ${{ inputs.summary }}
    # Phone-home: the `ci` command reads these off process.env directly (no entrypoint marshalling).
    # CLI 0.6.0 reads BINCLUSIVE_* only; `binclusive-api-url` maps to BINCLUSIVE_API_URL — the CLI's
    # single endpoint var (supersedes the old per-ingest ingest URL).
    BINCLUSIVE_API_KEY: ${{ inputs.binclusive-api-key }}
    BINCLUSIVE_PROJECT_ID: ${{ inputs.binclusive-project-id }}
    BINCLUSIVE_API_URL: ${{ inputs.binclusive-api-url }}
    # Deployment stamp: an `env:` key cannot be conditionally omitted, so an unset `environment`
    # input reaches the container as BINCLUSIVE_ENVIRONMENT="". That is EXACTLY equivalent to
    # unset here — `resolveCiEnvironment` trims and treats blank as absent, so a PR run still
    # stamps `pr` and a non-PR run still refuses loudly. (This is the one place the empty-forward
    # is safe by construction; `BINCLUSIVE_API_URL` needed a CLI-side fix for the same shape,
    # monorepo#3135 — do not assume it, the CLI's blank-is-absent test is the guarantee.)
    BINCLUSIVE_ENVIRONMENT: ${{ inputs.environment }}
