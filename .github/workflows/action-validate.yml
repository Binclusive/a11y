name: validate-action

# The repo ships one action.yml shell; this is the single gate that keeps it consumable —
# parse it as YAML and assert it still points at its GHCR image.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse action.yml
        run: |
          python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
          echo "ok: action.yml parses"

      - name: Assert the GHCR image ref is intact
        run: |
          grep -q 'docker://ghcr.io/binclusive/binclusive:0' action.yml
          echo "ok: image ref present"
